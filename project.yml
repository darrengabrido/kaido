name: Kaido
options:
  bundleIdPrefix: com.oaktreehouse
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios
    majorVersion: 11.0.0
  MapboxNavigation:
    url: https://github.com/mapbox/mapbox-navigation-ios.git
    majorVersion: 3.1.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    majorVersion: 5.0.0

targets:
  Kaido:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Kaido
    info:
      path: Kaido/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Kaido
        # Without these two spelled out, XcodeGen writes its own literal "1.0"/"1"
        # into Kaido/Info.plist and the app ships those instead of the versions
        # declared in `settings.base` below. Xcode expands $(...) in Info.plist at
        # build time, so naming them here keeps both tracking the build settings.
        # Deploy to TestFlight still stamps CFBundleVersion with PlistBuddy after
        # xcodegen runs; that write lands on top of this and is unaffected.
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        MBXAccessToken: "$(MAPBOX_ACCESS_TOKEN)"
        SupabaseHost: "$(SUPABASE_HOST)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        OpenAIAPIKey: "$(OPENAI_API_KEY)"
        SpotifyClientID: "$(SPOTIFY_CLIENT_ID)"
        NSLocationWhenInUseUsageDescription: "Kaido needs your location to show you on the map and provide turn-by-turn navigation."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Kaido needs your location to track your ride and keep navigating while your phone is locked or in your pocket."
        NSBluetoothAlwaysUsageDescription: "Kaido connects to your bike over Bluetooth to show live speed and battery data."
        NSAppleMusicUsageDescription: "Kaido shows what's playing and lets you control playback from the map so you don't have to leave the app."
        NSMicrophoneUsageDescription: "Kaido uses the microphone so you can dictate a quick message to your Ride Together group."
        NSSpeechRecognitionUsageDescription: "Kaido uses speech recognition to turn your dictated Ride Together messages into text before you send them."
        # Spotify's App Remote hands the access token back by opening this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: com.oaktreehouse.kaido.spotify
            CFBundleURLSchemes:
              - kaido
        # Required for -[UIApplication canOpenURL:] to see the Spotify app.
        LSApplicationQueriesSchemes:
          - spotify
        UIBackgroundModes:
          - location
          - bluetooth-central
          - remote-notification
          # Required by MapboxNavigationCore's RouteVoiceController — it raises a
          # fatal error at init if "audio" is missing, so navigation cannot start without it.
          - audio
    entitlements:
      path: Kaido/Kaido.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.oaktreehouse.kaido
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oaktreehouse.kaido
        PRODUCT_NAME: Kaido
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # XcodeGen doesn't infer this from the AppIcon.appiconset folder name —
        # without it, actool won't emit CFBundleIconName and app-store uploads
        # are rejected for a missing icon even when the asset catalog has one.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Signing comes from Config/*.xcconfig so CLI/archive overrides stay
        # off the xcodebuild command line (SPM resource bundles reject a
        # globally applied PROVISIONING_PROFILE_SPECIFIER).
        CODE_SIGN_STYLE: "$(CODE_SIGN_STYLE)"
        CODE_SIGN_IDENTITY: "$(CODE_SIGN_IDENTITY)"
        PROVISIONING_PROFILE_SPECIFIER: "$(PROVISIONING_PROFILE_SPECIFIER)"
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: MapboxMaps
      - package: MapboxNavigation
        product: MapboxNavigationCore
      - package: MapboxNavigation
        product: MapboxNavigationUIKit
      - package: Supabase
        product: Supabase
      - package: SpotifyiOS
        product: SpotifyiOS

  KaidoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: KaidoTests
    settings:
      base:
        # The test bundle has no Info.plist of its own, and code signing refuses
        # to run without one. CI never hit this because it builds with
        # CODE_SIGNING_ALLOWED=NO, but signing is on for local Xcode runs.
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Kaido
