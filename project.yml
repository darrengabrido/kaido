name: Kaido
options:
  bundleIdPrefix: com.oaktreehouse
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig

packages:
  MapboxMaps:
    url: https://github.com/mapbox/mapbox-maps-ios
    majorVersion: 11.0.0
  MapboxNavigation:
    url: https://github.com/mapbox/mapbox-navigation-ios.git
    majorVersion: 3.1.0
  Supabase:
    url: https://github.com/supabase/supabase-swift
    majorVersion: 2.0.0
  SpotifyiOS:
    url: https://github.com/spotify/ios-sdk
    majorVersion: 5.0.0

targets:
  Kaido:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: Kaido
    info:
      path: Kaido/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: Kaido
        MBXAccessToken: "$(MAPBOX_ACCESS_TOKEN)"
        SupabaseHost: "$(SUPABASE_HOST)"
        SupabaseAnonKey: "$(SUPABASE_ANON_KEY)"
        OpenAIAPIKey: "$(OPENAI_API_KEY)"
        SpotifyClientID: "$(SPOTIFY_CLIENT_ID)"
        NSLocationWhenInUseUsageDescription: "Kaido needs your location to show you on the map and provide turn-by-turn navigation."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Kaido needs your location to track your ride and keep navigating while your phone is locked or in your pocket."
        NSBluetoothAlwaysUsageDescription: "Kaido connects to your bike over Bluetooth to show live speed and battery data."
        NSAppleMusicUsageDescription: "Kaido shows what's playing and lets you control playback from the map so you don't have to leave the app."
        # Spotify's App Remote hands the access token back by opening this scheme.
        CFBundleURLTypes:
          - CFBundleURLName: com.oaktreehouse.kaido.spotify
            CFBundleURLSchemes:
              - kaido
        # Required for -[UIApplication canOpenURL:] to see the Spotify app.
        LSApplicationQueriesSchemes:
          - spotify
        UIBackgroundModes:
          - location
          - bluetooth-central
          - remote-notification
          # Required by MapboxNavigationCore's RouteVoiceController — it raises a
          # fatal error at init if "audio" is missing, so navigation cannot start without it.
          - audio
    entitlements:
      path: Kaido/Kaido.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.oaktreehouse.kaido
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
        com.apple.developer.applesignin:
          - Default
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.oaktreehouse.kaido
        PRODUCT_NAME: Kaido
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        # Signing comes from Config/*.xcconfig so CLI/archive overrides stay
        # off the xcodebuild command line (SPM resource bundles reject a
        # globally applied PROVISIONING_PROFILE_SPECIFIER).
        CODE_SIGN_STYLE: "$(CODE_SIGN_STYLE)"
        CODE_SIGN_IDENTITY: "$(CODE_SIGN_IDENTITY)"
        PROVISIONING_PROFILE_SPECIFIER: "$(PROVISIONING_PROFILE_SPECIFIER)"
        DEVELOPMENT_TEAM: "$(DEVELOPMENT_TEAM)"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    dependencies:
      - package: MapboxMaps
      - package: MapboxNavigation
        product: MapboxNavigationCore
      - package: MapboxNavigation
        product: MapboxNavigationUIKit
      - package: Supabase
        product: Supabase
      - package: SpotifyiOS
        product: SpotifyiOS
