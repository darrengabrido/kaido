name: Deploy to TestFlight

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testflight-deployment
  cancel-in-progress: false

env:
  APP_BUNDLE_ID: com.oaktreehouse.kaido
  # App Store Connect "Apple ID" for Kaido Ride (App Information), not an email.
  ASC_APP_APPLE_ID: "6796058480"

jobs:
  deploy:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 60
    environment: testflight

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Validate deployment secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          missing=0
          for name in \
            APPLE_TEAM_ID \
            MAPBOX_ACCESS_TOKEN \
            MAPBOX_DOWNLOADS_TOKEN \
            APPLE_DISTRIBUTION_CERTIFICATE_BASE64 \
            APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD \
            APP_STORE_PROVISIONING_PROFILE_BASE64 \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_API_KEY \
            SUPABASE_HOST \
            SUPABASE_ANON_KEY \
            SPOTIFY_CLIENT_ID
          do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required TestFlight secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Create app configuration
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MAPBOX_ACCESS_TOKEN: ${{ secrets.MAPBOX_ACCESS_TOKEN }}
          SUPABASE_HOST: ${{ secrets.SUPABASE_HOST }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
        run: |
          {
            echo "DEVELOPMENT_TEAM = $APPLE_TEAM_ID"
            echo "MAPBOX_ACCESS_TOKEN = $MAPBOX_ACCESS_TOKEN"
            echo "SUPABASE_HOST = $SUPABASE_HOST"
            echo "SUPABASE_ANON_KEY = $SUPABASE_ANON_KEY"
            echo "SPOTIFY_CLIENT_ID = $SPOTIFY_CLIENT_ID"
            echo "OPENAI_API_KEY ="
          } > Config/Secrets.xcconfig

      - name: Configure Mapbox SDK downloads
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          {
            echo "machine api.mapbox.com"
            echo "login mapbox"
            echo "password $MAPBOX_DOWNLOADS_TOKEN"
          } > "$HOME/.netrc"
          chmod 0600 "$HOME/.netrc"

      - name: Install signing certificate and profile
        env:
          APPLE_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_BASE64 }}
          APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APP_STORE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/kaido-build.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          printf '%s' "$APPLE_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"
          printf '%s' "$APP_STORE_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" "$PROFILE_PLIST")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

          # Scope Manual signing to the Kaido target via xcconfig (not xcodebuild CLI),
          # otherwise SPM resource bundles reject the App Store profile.
          {
            echo "CODE_SIGN_STYLE = Manual"
            echo "CODE_SIGN_IDENTITY = Apple Distribution"
            echo "PROVISIONING_PROFILE_SPECIFIER = $PROFILE_NAME"
          } >> Config/Secrets.xcconfig

      - name: Configure App Store Connect API key
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          # Trim accidental whitespace/newlines from IDs — they break JWT auth.
          KEY_ID="$(printf '%s' "$APP_STORE_CONNECT_KEY_ID" | tr -d '[:space:]')"
          ISSUER_ID="$(printf '%s' "$APP_STORE_CONNECT_ISSUER_ID" | tr -d '[:space:]')"
          echo "APP_STORE_CONNECT_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "APP_STORE_CONNECT_ISSUER_ID=$ISSUER_ID" >> "$GITHUB_ENV"

          # Accept either raw PEM or PEM with literal \n sequences from secret UIs.
          KEY_PEM="$(printf '%s' "$APP_STORE_CONNECT_API_KEY" | sed 's/\r$//' | sed 's/\\n/\n/g')"
          if ! printf '%s\n' "$KEY_PEM" | grep -q 'BEGIN PRIVATE KEY'; then
            echo "::error::APP_STORE_CONNECT_API_KEY must be the full .p8 PEM (including BEGIN/END PRIVATE KEY lines) for a Team key from App Store Connect → Users and Access → Integrations → App Store Connect API."
            exit 1
          fi

          # altool only accepts Team API keys — Apple has confirmed Individual
          # keys are not supported for any authenticated altool call, so there
          # is no fallback auth mode to install for. altool's search path for
          # the .p8 is also inconsistent across subcommands, so install it
          # everywhere it might look; set API_PRIVATE_KEYS_DIR explicitly too.
          KEYS_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$KEYS_DIR" "$HOME/private_keys" "$HOME/.private_keys"
          # Ensure the PEM ends with a newline (required for valid JWT signing).
          printf '%s\n' "$KEY_PEM" > "$KEYS_DIR/AuthKey_${KEY_ID}.p8"
          for dest in "$HOME/private_keys" "$HOME/.private_keys"; do
            cp "$KEYS_DIR/AuthKey_${KEY_ID}.p8" "$dest/AuthKey_${KEY_ID}.p8"
            chmod 0600 "$dest/AuthKey_${KEY_ID}.p8"
          done
          chmod 0600 "$KEYS_DIR/AuthKey_${KEY_ID}.p8"
          echo "API_PRIVATE_KEYS_DIR=$KEYS_DIR" >> "$GITHUB_ENV"

          echo "Installed AuthKey_${KEY_ID}.p8 ($(wc -c < "$KEYS_DIR/AuthKey_${KEY_ID}.p8" | tr -d ' ') bytes)"

      - name: Verify App Store Connect API auth
        run: |
          if ! xcrun altool --list-apps \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            --output-format json \
            > "$RUNNER_TEMP/asc-apps.json" 2>"$RUNNER_TEMP/asc-apps.err"
          then
            echo "::error::App Store Connect API auth failed. The APP_STORE_CONNECT_KEY_ID / APP_STORE_CONNECT_ISSUER_ID / APP_STORE_CONNECT_API_KEY secrets do not form a valid, active Team API key. In App Store Connect → Users and Access → Integrations → App Store Connect API: confirm the key's status is Active (not Revoked) and its role is Admin or App Manager, then re-copy the Key ID and Issuer ID from that page. If there's any doubt about the .p8 contents, generate a new key (Apple only allows downloading the .p8 once) and update all three GitHub secrets together. Also check Settings → Environments → testflight in this repo for a same-named secret shadowing a correct repo-level one."
            echo "Key ID length: ${#APP_STORE_CONNECT_KEY_ID}; Issuer ID length: ${#APP_STORE_CONNECT_ISSUER_ID}"
            cat "$RUNNER_TEMP/asc-apps.err" || true
            exit 1
          fi

          echo "list-apps succeeded"
          # Xcode 26.5 can exit successfully while writing no list-apps payload.
          # That is inconclusive, not proof of a working key — the explicit
          # --upload-package command below is the authoritative check.
          if [[ ! -s "$RUNNER_TEMP/asc-apps.json" ]]; then
            echo "::warning::altool list-apps returned an empty payload; continuing to upload-package with Kaido's explicit Apple ID."
            cat "$RUNNER_TEMP/asc-apps.err" || true
          else
            # Safe to print: no secrets, helps confirm which apps this key can see.
            python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "asc-apps.json"
          text = path.read_text(errors="replace")
          print(text[:4000])
          try:
              data = json.loads(text)
          except Exception as exc:
              print(f"::error::list-apps JSON parse failed: {exc}")
              sys.exit(1)
          blob = json.dumps(data)
          if "com.oaktreehouse.kaido" not in blob and "6796058480" not in blob:
              print(
                  "::error::API key authenticated, but Kaido "
                  "(com.oaktreehouse.kaido / Apple ID 6796058480) is not visible "
                  "to this key. Create/reuse a Team key on the same App Store "
                  "Connect team that owns Kaido Ride."
              )
              sys.exit(1)
          print("Kaido is visible to this API key")
          PY
          fi

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild \
            -project Kaido.xcodeproj \
            -scheme Kaido \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/Kaido.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--keychain $SIGNING_KEYCHAIN_PATH" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            clean archive

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$APP_BUNDLE_ID</key>
              <string>$PROVISIONING_PROFILE_SPECIFIER</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Kaido.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

          test -f "$RUNNER_TEMP/export/Kaido.ipa"

      - name: Upload to TestFlight
        run: |
          IPA="$RUNNER_TEMP/export/Kaido.ipa"
          PAYLOAD_DIR="$RUNNER_TEMP/ipa-payload"
          rm -rf "$PAYLOAD_DIR"
          mkdir -p "$PAYLOAD_DIR"
          unzip -q -o "$IPA" -d "$PAYLOAD_DIR"
          INFO_PLIST="$(echo "$PAYLOAD_DIR"/Payload/*.app/Info.plist)"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$INFO_PLIST" > "$RUNNER_TEMP/bundle-id.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST" > "$RUNNER_TEMP/short-version.txt"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST" > "$RUNNER_TEMP/bundle-version.txt"
          BUNDLE_ID="$(cat "$RUNNER_TEMP/bundle-id.txt")"
          SHORT_VERSION="$(cat "$RUNNER_TEMP/short-version.txt")"
          BUNDLE_VERSION="$(cat "$RUNNER_TEMP/bundle-version.txt")"
          echo "Uploading $BUNDLE_ID $SHORT_VERSION ($BUNDLE_VERSION) → Apple ID $ASC_APP_APPLE_ID"

          # Xcode 26 altool prefers --upload-package with explicit app identity.
          # Legacy --upload-app looks up the Apple ID from the bundle ID and 401s
          # when that lookup fails — even if the .p8 itself is valid.
          # Team API key only: Apple has confirmed altool does not accept
          # Individual API keys, so a 401 here means the Team key itself needs
          # attention in App Store Connect, not a different auth mode to try.
          set +e
          xcrun altool \
            --upload-package "$IPA" \
            --platform ios \
            --apple-id "$ASC_APP_APPLE_ID" \
            --bundle-id "$BUNDLE_ID" \
            --bundle-short-version-string "$SHORT_VERSION" \
            --bundle-version "$BUNDLE_VERSION" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID" \
            > "$RUNNER_TEMP/team-upload.log" 2>&1
          upload_status=$?
          set -e
          cat "$RUNNER_TEMP/team-upload.log"

          if [[ $upload_status -ne 0 ]] && grep -Eq 'NOT_AUTHORIZED|Unable to authenticate|status code 401' \
            "$RUNNER_TEMP/team-upload.log"
          then
            echo "::error::Upload rejected with 401 NOT_AUTHORIZED. The Team API key is not authorized for build uploads. In App Store Connect → Users and Access → Integrations → App Store Connect API, confirm the key's status is Active and its role is Admin or App Manager, and that it belongs to the same team that owns Kaido Ride (Apple ID $ASC_APP_APPLE_ID). If in doubt, generate a new key (the .p8 can only be downloaded once) and update APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, and APP_STORE_CONNECT_API_KEY together — see README.md's TestFlight deployment section. Also check Settings → Environments → testflight for a stale secret of the same name overriding the repo-level one."
          fi

          exit "$upload_status"

      - name: Clean up signing keychain
        if: always()
        run: |
          if [[ -n "${SIGNING_KEYCHAIN_PATH:-}" ]]; then
            security delete-keychain "$SIGNING_KEYCHAIN_PATH" || true
          fi
