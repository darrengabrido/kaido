name: iOS Build

on:
  # Public repos get unlimited free GitHub-hosted runner minutes (including
  # macOS), so this is no longer competing with Deploy to TestFlight/Xcode
  # Cloud for a shared paid quota.
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create CI configuration
        run: |
          {
            echo "DEVELOPMENT_TEAM = TEMPTEAMID"
            echo "MAPBOX_ACCESS_TOKEN = pk.ci-placeholder"
            echo "SUPABASE_HOST ="
            echo "SUPABASE_ANON_KEY ="
            echo "OPENAI_API_KEY ="
          } > Config/Secrets.xcconfig

      - name: Configure Mapbox SDK downloads
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [[ -z "$MAPBOX_DOWNLOADS_TOKEN" ]]; then
            echo "::error::Add a MAPBOX_DOWNLOADS_TOKEN repository secret with the Mapbox DOWNLOADS:READ scope."
            exit 1
          fi
          {
            echo "machine api.mapbox.com"
            echo "login mapbox"
            echo "password $MAPBOX_DOWNLOADS_TOKEN"
          } > "$HOME/.netrc"
          chmod 0600 "$HOME/.netrc"

      - name: Generate Xcode project
        run: xcodegen generate

      # The build below passes CODE_SIGNING_ALLOWED=NO, so anything that only
      # breaks once signing runs is invisible to it — a target with no
      # Info.plist builds fine here and fails the moment someone runs it from
      # Xcode. Deploy to TestFlight doesn't cover the gap either: it archives
      # the app target alone and never builds the test bundle. Assert the
      # setting directly instead, which costs seconds and needs no certificates.
      - name: Check every target can be code signed
        run: |
          for target in $(xcodebuild -project Kaido.xcodeproj -list -json | jq -r '.project.targets[]'); do
            settings="$(xcodebuild -project Kaido.xcodeproj -target "$target" -showBuildSettings 2>/dev/null)"
            if grep -qE '^[[:space:]]+(INFOPLIST_FILE = .|GENERATE_INFOPLIST_FILE = YES)' <<<"$settings"; then
              echo "✓ $target"
            else
              echo "::error::Target '$target' has no Info.plist and won't generate one, so code signing it fails. Set GENERATE_INFOPLIST_FILE: YES on the target in project.yml."
              exit 1
            fi
          done

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Kaido.xcodeproj \
            -scheme Kaido \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Kaido.xcodeproj \
            -scheme Kaido \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            test
