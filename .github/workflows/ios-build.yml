name: iOS Build

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for iOS Simulator
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode 26.5
        run: sudo xcode-select -s /Applications/Xcode_26.5.app/Contents/Developer

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Create CI configuration
        run: |
          {
            echo "DEVELOPMENT_TEAM = TEMPTEAMID"
            echo "MAPBOX_ACCESS_TOKEN = pk.ci-placeholder"
            echo "SUPABASE_HOST ="
            echo "SUPABASE_ANON_KEY ="
            echo "OPENAI_API_KEY ="
          } > Config/Secrets.xcconfig

      - name: Configure Mapbox SDK downloads
        env:
          MAPBOX_DOWNLOADS_TOKEN: ${{ secrets.MAPBOX_DOWNLOADS_TOKEN }}
        run: |
          if [[ -z "$MAPBOX_DOWNLOADS_TOKEN" ]]; then
            echo "::error::Add a MAPBOX_DOWNLOADS_TOKEN repository secret with the Mapbox DOWNLOADS:READ scope."
            exit 1
          fi
          {
            echo "machine api.mapbox.com"
            echo "login mapbox"
            echo "password $MAPBOX_DOWNLOADS_TOKEN"
          } > "$HOME/.netrc"
          chmod 0600 "$HOME/.netrc"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project Kaido.xcodeproj \
            -scheme Kaido \
            -configuration Debug \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild \
            -project Kaido.xcodeproj \
            -scheme Kaido \
            -configuration Debug \
            -destination "platform=iOS Simulator,name=iPhone 17,OS=latest" \
            CODE_SIGNING_ALLOWED=NO \
            test
